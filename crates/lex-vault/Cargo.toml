[package]
name = "lex-vault"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Inactive synthetic SQLCipher viability spike; not the production store"

[dependencies]
rusqlite = { version = "=0.41.1", features = ["bundled-sqlcipher"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tempfile = "=3.23.0"
getrandom = "=0.3.4"
zeroize = { version = "=1.8.2", features = ["derive"] }
unicode-normalization = "=0.1.24"

[workspace]
