name: Main experimental integration
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: main-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  portable-contracts-and-build:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.13.1'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      # Fresh clones omit generated public-library.sqlite and model research assets;
      # Node 22.13.1 on this runner also lacks FTS5. Keep this gate explicit.
      - name: Portable source contracts from a clean checkout
        run: |
          # The historical V1 byte-exact Python/JS score test is retained for
          # its frozen macOS evidence; Linux libm differs by ~6e-15. Its new
          # portable counterpart asserts all other fields exactly and bounds
          # the score difference to 1e-12 across all 40 labels.
          echo 'Excluding one frozen V1 exact-float comparison; running portable 40-label parity instead.'
          node --test --test-skip-pattern='^Python pure decoder mirrors JS across all40 native labels and Unicode$' \
            tests/landing-downloads.test.mjs \
            tests/privacy-nym-int8-decoder.test.mjs \
            tests/privacy-nym-float-parity-portable.test.mjs \
            tests/privacy-nym-int8-decoder-v2.test.mjs \
            tests/privacy-nym-int8-decoder-v3.test.mjs \
            tests/openrouter-provider.test.mjs \
            tests/windows-descendant-classification-diagnostic.test.mjs \
            tests/windows-owned-tree-bootstrap-diagnostic.test.mjs
