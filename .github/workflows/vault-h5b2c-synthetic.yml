name: H5b.2c synthetic pseudonym maps (public macOS only)
on:
  push:
    branches: [pedro/h5b2c-pseudonym-maps-20261111]
    paths:
      - crates/lex-vault/**
      - .github/workflows/vault-h5b2c-synthetic.yml
  pull_request:
    branches: [main]
    paths:
      - crates/lex-vault/**
      - .github/workflows/vault-h5b2c-synthetic.yml
permissions:
  contents: read
concurrency:
  group: vault-h5b2c-synthetic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pseudonym-maps:
    if: ${{ github.event.repository.private == false }}
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Confirm clean public runner and local-only test scope
        shell: bash
        run: |
          test "${{ runner.os }}" = "macOS"
          test "${{ github.event.repository.private }}" = "false"
          test -z "$(git status --porcelain)"
          rustc --version
          cargo --version
      - name: Run only H5b.2c synthetic native acceptance tests
        shell: bash
        run: |
          cargo test --locked --manifest-path crates/lex-vault/Cargo.toml --test pseudonym_maps -- --test-threads=1
      - name: Run SQL-trigger and FK unit regressions (synthetic only)
        shell: bash
        run: |
          cargo test --locked --manifest-path crates/lex-vault/Cargo.toml --lib pseudonym_maps::internal_schema_guards -- --test-threads=1
