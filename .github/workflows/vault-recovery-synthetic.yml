name: Vault synthetic recovery first batch only
on:
  push:
    branches: [docs/hybrid-psf-development-loop]
    paths:
      - crates/lex-vault/**
      - docs/qa/vault-recovery-synthetic-freeze-2026-11-10.json
      - .github/workflows/vault-recovery-synthetic.yml
permissions:
  contents: read
jobs:
  synthetic-first-batch:
    if: ${{ github.event.repository.private == false && startsWith(github.event.head_commit.message, '[vault-recovery-synthetic]') }}
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      max-parallel: 1
    concurrency:
      group: vault-recovery-synthetic-public
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Frozen compile, supervisor regression, then one synthetic first batch
        shell: bash
        run: |
          python3 - <<'PY_CI'
          import hashlib, json, os, pathlib, re, shutil, signal, stat, subprocess, sys, tempfile, time
          if sys.version_info < (3, 11):
              print('{"status":"FIRST_BATCH_ONLY","result":"PARTIAL_FAILURE","category":"PREINSTALLED_PYTHON_TOO_OLD","testsExecuted":false,"cryptoTestsExecuted":false,"cryptographyValidated":false,"h5Complete":false,"physical8GBValidated":false,"technicalPass":false,"recoveryPrototypeReadonlyValidated":false}')
              sys.exit(1)
          import tomllib
          repo = pathlib.Path.cwd().resolve()
          freeze_path = 'docs/qa/vault-recovery-synthetic-freeze-2026-11-10.json'
          workflow_path = '.github/workflows/vault-recovery-synthetic.yml'
          crate_prefix = 'crates/lex-vault/'
          native = {crate_prefix + p for p in ['Cargo.toml', 'Cargo.lock', 'README.md', 'src/lib.rs', 'src/recovery.rs', 'tests/recovery.rs', 'tests/recovery_process.rs', 'tests/support/recovery_fixture.rs']}
          report = {'status': 'FIRST_BATCH_ONLY', 'result': 'PARTIAL_FAILURE', 'category': None, 'feature': 'synthetic-recovery', 'testsExecuted': False, 'supervisorTestInvoked': False, 'cryptoTestsExecuted': False, 'h5Complete': False, 'recoveryHelperDirectlyInvoked': False, 'cryptographyValidated': False, 'physical8GBValidated': False, 'thirdPartyBuildCodeMayExecute': True, 'sourceFreezePre': False, 'sourceFreezePost': False, 'compilationAttempted': False}
          expires = time.monotonic() + 840
          stage = 'SOURCE_PREFLIGHT'
          expected = None
          task = None
          copied = None
          supervisor_log = None
          supervisor_started = None
          batch_log = None
          batch_started = None
          protocol_path = 'resources/vault-recovery-synthetic-v1.json'
          protocol_sha = '1b1125e92adb2e1360c67ca3dcaa1b86daa01e26591e7f6df496f7cd73195794'
          expected_cases = {'R01': 0, 'R03-wrong': 3, 'R03-missing': 2, 'R04-missing': 'MissingCredential', 'R04-wrong': 'SourceIntegrity', 'R05-live': 'SourceNotQuiescent', 'R05-retained-closed': 'SourceNotQuiescent', 'R06-final-truncate': 3, 'R07-body-flip': 3, 'R09-foreign': 5, 'R13-staging-collision': 11, 'R17-cipher-size': 9, 'R17-header': 9, 'R17-plain-size': 9, 'R17-log19': 9, 'R23a-internal-append': 4, 'R23b-external-append': 3, 'R18-scanner': None}
          r23 = {'R23a-internal-append': {'categoryCode': 4, 'published': False}, 'R23b-external-append': {'categoryCode': 3, 'published': False}}
          preparation = {'baseFixture': 1, 'negativeSealFixtures': 4, 'baseExports': 1, 'authenticatedNegativeEnvelopes': 2}
          def check(condition):
              if not condition:
                  raise ValueError('policy')
          def safe_file(root, relative):
              check(isinstance(relative, str) and relative and '\\' not in relative and not relative.startswith('/'))
              parts = relative.split('/')
              check(all(p not in ('', '.', '..') for p in parts))
              current = root
              for i, part in enumerate(parts):
                  current = current / part
                  info = current.lstat()
                  check(not stat.S_ISLNK(info.st_mode))
                  check(stat.S_ISREG(info.st_mode) if i == len(parts)-1 else stat.S_ISDIR(info.st_mode))
              return current
          def digest(file):
              result = hashlib.sha256()
              with open(file, 'rb') as source:
                  for chunk in iter(lambda: source.read(1048576), b''):
                      result.update(chunk)
              return result.hexdigest()
          def verify(root):
              for file, sha in expected.items():
                  check(digest(safe_file(root, file)) == sha)
              check(digest(safe_file(repo, workflow_path)) == freeze['workflowSha256'])
              check(digest(safe_file(repo, protocol_path)) == protocol_sha)
          def remaining(limit):
              value = min(limit, expires-time.monotonic())
              if value <= 0:
                  raise TimeoutError('driver budget')
              return value
          def reserve_phase(seconds):
              check(expires-time.monotonic() >= seconds+10)
          def captured(args, cwd, env, timeout=15):
              return subprocess.run(args, cwd=cwd, env=env, check=True, capture_output=True, text=True, timeout=remaining(timeout)).stdout.strip()
          try:
              freeze = json.loads(safe_file(repo, freeze_path).read_text())
              check(freeze.get('schemaVersion') == 1 and freeze.get('scope') == 'SYNTHETIC_RECOVERY_FIRST_BATCH')
              check(freeze.get('feature') == 'synthetic-recovery' and freeze.get('minimumRustVersion') == '1.99.0')
              check(freeze.get('approvedForSingleSyntheticRecoveryRun') is True)
              check(freeze.get('protocolSha256') == protocol_sha)
              check(freeze.get('expectedCaseInvocations') == 18 and freeze.get('maxCaseMs') == 60000 and freeze.get('maxBatchMs') == 300000)
              check(freeze.get('maxRssBytes') == 805306368 and freeze.get('rssIntervalMs') == 50)
              check(freeze.get('requiredCaseIds') == list(expected_cases) and freeze.get('r23Bindings') == r23)
              check(freeze.get('expectedPreparation') == preparation)
              check(isinstance(freeze.get('sourceHashes'), dict) and set(freeze['sourceHashes']) == native)
              check(isinstance(freeze.get('baselineSourceHashes'), dict))
              check(not set(freeze['sourceHashes']).intersection(freeze['baselineSourceHashes']))
              expected = {**freeze['sourceHashes'], **freeze['baselineSourceHashes']}
              check(all(isinstance(h, str) and re.fullmatch('[0-9a-f]{64}', h) for h in [*expected.values(), freeze.get('workflowSha256')]))
              tracked = captured(['/usr/bin/git', 'ls-files', '-z', '--', 'crates/lex-vault'], repo, os.environ).split('\0')
              tracked = {p for p in tracked if p}
              check(set(expected) == tracked)
              check(all(p.startswith(crate_prefix) and (p.endswith('.rs') or p in native) for p in tracked))
              verify(repo)
              manifest = tomllib.loads(safe_file(repo, crate_prefix+'Cargo.toml').read_text())
              lock = tomllib.loads(safe_file(repo, crate_prefix+'Cargo.lock').read_text())
              check(manifest['package']['name'] == 'lex-vault' and manifest.get('workspace') == {})
              check(manifest['features']['default'] == [] and manifest['features']['synthetic-recovery'] == ['dep:age'])
              check(manifest['dependencies']['age']['optional'] is True and manifest['dependencies']['age']['default-features'] is False)
              check('patch' not in manifest and 'replace' not in manifest)
              for tables in [manifest, *manifest.get('target', {}).values()]:
                  for section in ['dependencies', 'dev-dependencies', 'build-dependencies']:
                      for entry in tables.get(section, {}).values():
                          if isinstance(entry, dict):
                              check(not {'path', 'git', 'registry', 'registry-index', 'workspace', 'branch', 'tag', 'rev'}.intersection(entry))
              for kind in ['bin', 'test', 'example', 'bench']:
                  for entry in manifest.get(kind, []):
                      if 'path' in entry:
                          check(crate_prefix+entry['path'] in tracked)
              for entry in [manifest.get('lib', {}), manifest['package']]:
                  for key in ['path', 'build']:
                      if key in entry and entry[key] is not False:
                          check(isinstance(entry[key], str) and crate_prefix+entry[key] in tracked)
              locals_ = [p for p in lock['package'] if 'source' not in p]
              check(len(locals_) == 1 and locals_[0]['name'] == 'lex-vault' and locals_[0]['version'] == manifest['package']['version'])
              registry = [p for p in lock['package'] if 'source' in p]
              check(len(registry) == 179)
              check(all(p['source'] == 'registry+https://github.com/rust-lang/crates.io-index' and re.fullmatch('[0-9a-f]{64}', p.get('checksum', '')) for p in registry))
              report['lockedRegistryPackages'] = len(registry)
              protocol = json.loads(safe_file(repo, protocol_path).read_text())
              check(protocol['protocolId'] == 'vault-recovery-synthetic-v1' and len(protocol['caseMatrix']) == 24)
              check(protocol['firstImplementationBatch']['exactAllocatedInvocations'] == 18)
              check(protocol['limits']['maxCaseMs'] == 60000 and protocol['limits']['maxBatchMs'] == 300000 and protocol['limits']['rssCancellationThresholdBytes'] == 805306368 and protocol['limits']['rssSamplingMaxMs'] == 50)
              report['sourceFreezePre'] = True
              stage = 'PREINSTALLED_TOOLCHAIN'
              runner_temp = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
              task = pathlib.Path(tempfile.mkdtemp(prefix='lex-vault-compile-', dir=runner_temp))
              lookup_env = dict(os.environ)
              lookup_env.pop('RUSTUP_TOOLCHAIN', None)
              lookup_env['RUSTUP_AUTO_INSTALL'] = '0'
              rustup = pathlib.Path(shutil.which('rustup') or '').resolve(strict=True)
              check(rustup.is_file() and os.access(rustup, os.X_OK))
              tools = {}
              for name in ['cargo', 'rustc', 'rustdoc']:
                  value = captured([str(rustup), 'which', name], task, lookup_env)
                  check(pathlib.Path(value).is_absolute())
                  tool = pathlib.Path(value).resolve(strict=True)
                  check(tool.name == name and tool.is_file() and os.access(tool, os.X_OK))
                  tools[name] = tool
              check(len({p.parent for p in tools.values()}) == 1)
              cargo_home, target, temporary = [task / p for p in ['cargo-home', 'target', 'tmp']]
              for directory in [cargo_home, target, temporary]:
                  directory.mkdir(mode=0o700)
              clean = {'PATH': str(tools['cargo'].parent)+':/usr/bin:/bin:/usr/sbin:/sbin', 'CARGO_HOME': str(cargo_home), 'CARGO_TARGET_DIR': str(target), 'TMPDIR': str(temporary)+'/', 'RUSTC': str(tools['rustc']), 'RUSTDOC': str(tools['rustdoc']), 'CARGO_NET_RETRY': '0', 'CARGO_HTTP_TIMEOUT': '15', 'CARGO_REGISTRIES_CRATES_IO_PROTOCOL': 'sparse', 'CARGO_TERM_COLOR': 'never', 'CARGO_BUILD_JOBS': '1', 'CARGO_BUILD_TARGET': 'aarch64-apple-darwin', 'LANG': 'C', 'LC_ALL': 'C', 'TZ': 'UTC', 'RUSTUP_AUTO_INSTALL': '0'}
              def isolated(args, timeout, sandbox=False, output=None):
                  command = ['/usr/bin/env', '-i', *[k+'='+v for k, v in clean.items()]]
                  if sandbox:
                      command += ['/usr/bin/sandbox-exec', '-f', str(task/'compile-no-network.sb')]
                  reserve_phase(timeout)
                  allotted = timeout
                  output_file = open(output, 'wb') if output is not None else None
                  process = subprocess.Popen([*command, *args], cwd=copied or task, env=clean, start_new_session=True, stdout=output_file, stderr=subprocess.STDOUT if output_file is not None else None)
                  try:
                      check(process.wait(timeout=allotted) == 0)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGTERM)
                      try:
                          process.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          os.killpg(process.pid, signal.SIGKILL)
                          process.wait(timeout=5)
                      raise
                  finally:
                      if output_file is not None:
                          output_file.close()
              version = captured([str(tools['rustc']), '--version'], task, clean)
              match = re.fullmatch(r'rustc (\d+)\.(\d+)\.(\d+)(?: .*)?', version)
              check(match is not None and tuple(map(int, match.groups())) >= (1, 99, 0))
              check('host: aarch64-apple-darwin' in captured([str(tools['rustc']), '-vV'], task, clean))
              report['rustcVersion'] = version
              report['cargoVersion'] = captured([str(tools['cargo']), '--version'], task, clean)
              print(json.dumps({'preinstalledRustc': version, 'preinstalledCargo': report['cargoVersion']}), flush=True)
              stage = 'PREINSTALLED_SDK'
              developer = pathlib.Path(captured(['/usr/bin/xcode-select', '-p'], task, clean)).resolve(strict=True)
              check(developer.is_dir())
              sdk = pathlib.Path(captured(['/usr/bin/xcrun', '--show-sdk-path'], task, clean)).resolve(strict=True)
              check(sdk.is_dir())
              for name in ['clang', 'clang++']:
                  compiler = pathlib.Path(captured(['/usr/bin/xcrun', '--find', name], task, clean)).resolve(strict=True)
                  check(compiler.is_file() and os.access(compiler, os.X_OK))
                  clean['CC' if name == 'clang' else 'CXX'] = str(compiler)
              clean['SDKROOT'] = str(sdk)
              check(pathlib.Path('/usr/bin/sandbox-exec').is_file())
              (task/'compile-no-network.sb').write_text('(version 1)\n(allow default)\n(deny network*)\n')
              stage = 'ISOLATED_COPY'
              copied = task / 'source'
              copied.mkdir()
              for file in sorted(tracked):
                  relative = file[len(crate_prefix):]
                  destination = copied / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(safe_file(repo, file), destination)
              check({p.relative_to(copied).as_posix() for p in copied.rglob('*') if p.is_file()} == {p[len(crate_prefix):] for p in tracked})
              for ancestor in [copied, *copied.parents]:
                  check(not (ancestor/'.cargo/config').exists() and not (ancestor/'.cargo/config.toml').exists())
              (cargo_home/'config.toml').write_text('[net]\nretry = 0\n[http]\ntimeout = 15\n[registries.crates-io]\nprotocol = "sparse"\n')
              stage = 'ANONYMOUS_LOCKED_FETCH'
              reserve_phase(240)
              isolated([str(tools['cargo']), 'fetch', '--locked', '--target', 'aarch64-apple-darwin', '--manifest-path', str(copied/'Cargo.toml')], 240)
              stage = 'OFFLINE_COMPILATION_NO_RUN'
              clean['CARGO_NET_OFFLINE'] = 'true'
              report['compilationAttempted'] = True
              reserve_phase(300)
              isolated([str(tools['cargo']), 'test', '--locked', '--offline', '--features', 'synthetic-recovery', '--no-run', '--jobs', '1', '--target', 'aarch64-apple-darwin', '--manifest-path', str(copied/'Cargo.toml')], 300, sandbox=True)
              stage = 'SUPERVISOR_RESOURCE_TEST'
              supervisor_log = task/'supervisor-test-output.txt'
              reserve_phase(90)
              supervisor_started = time.monotonic()
              report['supervisorTestInvoked'] = True
              isolated([str(tools['cargo']), 'test', '--locked', '--offline', '--manifest-path', str(copied/'Cargo.toml'), '--features', 'synthetic-recovery', '--test', 'recovery', 'supervisor_cleanup_without_crypto', '--', '--ignored', '--exact', '--nocapture', '--test-threads=1'], 90, sandbox=True, output=supervisor_log)
              report['supervisorWallMs'] = round((time.monotonic()-supervisor_started)*1000, 3)
              check(supervisor_log.stat().st_size <= 1048576)
              supervisor_output = supervisor_log.read_text()
              check(re.search(r'^running 1 test$', supervisor_output, re.M) is not None)
              check(re.search(r'^test result: ok\. 1 passed; 0 failed; 0 ignored;', supervisor_output, re.M) is not None)
              check('supervisor_cleanup_without_crypto' in supervisor_output)
              report['testsExecuted'] = True
              report['supervisorTestResult'] = 'PASS'
              stage = 'SYNTHETIC_BATCH_RESERVED_WINDOW'
              reserve_phase(300)
              batch_log = task/'synthetic-first-batch-output.txt'
              batch_started = time.monotonic()
              report['cryptoBatchCommandRequested'] = True
              stage = 'SYNTHETIC_FIRST_BATCH'
              isolated([str(tools['cargo']), 'test', '--locked', '--offline', '--manifest-path', str(copied/'Cargo.toml'), '--features', 'synthetic-recovery', '--test', 'recovery', 'first_batch_18', '--', '--ignored', '--exact', '--nocapture', '--test-threads=1'], 300, sandbox=True, output=batch_log)
              stage = 'RECEIPT_VALIDATION'
              check(batch_log.stat().st_size <= 1048576)
              output = batch_log.read_text()
              check(re.search(r'^running 1 test$', output, re.M) is not None)
              check(re.search(r'^test first_batch_18 \.\.\.', output, re.M) is not None)
              check(re.search(r'^test result: ok\. 1 passed; 0 failed; 0 ignored;', output, re.M) is not None)
              payloads = []
              for line in output.splitlines():
                  if line.startswith('test first_batch_18 ... '):
                      line = line[len('test first_batch_18 ... '):]
                  if line.startswith('{'):
                      payloads.append(line)
              check(len(payloads) == 1)
              def unique_object(pairs):
                  result = {}
                  for key, value in pairs:
                      check(key not in result)
                      result[key] = value
                  return result
              def invalid_constant(value):
                  raise ValueError('nonfinite')
              receipt = json.loads(payloads[0], object_pairs_hook=unique_object, parse_constant=invalid_constant)
              check(set(receipt) == {'protocol', 'invocations', 'caseMatrixRows', 'firstBatchOnly', 'eofChecksPassed', 'roundtripProvisional', 'productionEnabled', 'h5Complete', 'preparation', 'peakSampledChildRssBytes', 'peakParentRssBytes', 'elapsedMs', 'cases'})
              check(receipt['protocol'] == 'vault-recovery-synthetic-v1' and type(receipt['invocations']) is int and receipt['invocations'] == 18 and type(receipt['caseMatrixRows']) is int and receipt['caseMatrixRows'] == 24)
              check(receipt['firstBatchOnly'] is True and receipt['eofChecksPassed'] is True and receipt['roundtripProvisional'] is False and receipt['productionEnabled'] is False and receipt['h5Complete'] is False)
              check(isinstance(receipt['preparation'], dict) and receipt['preparation'] == preparation and all(type(v) is int for v in receipt['preparation'].values()))
              for field in ['peakSampledChildRssBytes', 'peakParentRssBytes']:
                  check(type(receipt[field]) is int and 0 < receipt[field] <= 805306368)
              check(type(receipt['elapsedMs']) is int and 0 < receipt['elapsedMs'] < 300000)
              check(isinstance(receipt['cases'], list) and len(receipt['cases']) == 18)
              check([case.get('id') for case in receipt['cases']] == list(expected_cases))
              for case in receipt['cases']:
                  if case['id'] == 'R18-scanner':
                      check(set(case) == {'id', 'positiveControl', 'encryptedNegative'} and case['positiveControl'] is True and case['encryptedNegative'] is True)
                  else:
                      check(set(case) == {'id', 'categoryCode', 'published'})
                      expected_code = expected_cases[case['id']]
                      check(type(case['categoryCode']) is type(expected_code) and case['categoryCode'] == expected_code and case['published'] is (case['id'] == 'R01'))
              report['receipt'] = receipt
              report['receiptValidated'] = True
              report['result'] = 'PASS'
          except Exception:
              report['category'] = stage
          finally:
              if batch_started is not None:
                  report['cryptoBatchWallMs'] = round((time.monotonic()-batch_started)*1000, 3)
              if batch_log is not None and batch_log.exists():
                  if batch_log.stat().st_size <= 1048576:
                      batch_output = batch_log.read_text(errors='replace')
                      report['cryptoTestsExecuted'] = re.search(r'^running 1 test$', batch_output, re.M) is not None and re.search(r'^test first_batch_18 \.\.\.', batch_output, re.M) is not None
                      print(batch_output, flush=True)
                  else:
                      report['category'] = 'BATCH_OUTPUT_LIMIT'
                      report['result'] = 'PARTIAL_FAILURE'
              if supervisor_started is not None and 'supervisorWallMs' not in report:
                  report['supervisorWallMs'] = round((time.monotonic()-supervisor_started)*1000, 3)
              if supervisor_log is not None and supervisor_log.exists():
                  if supervisor_log.stat().st_size <= 1048576:
                      output = supervisor_log.read_text(errors='replace')
                      report['testsExecuted'] = re.search(r'^running 1 test$', output, re.M) is not None
                      print(output, flush=True)
                  else:
                      report['category'] = 'SUPERVISOR_OUTPUT_LIMIT'
                      report['result'] = 'PARTIAL_FAILURE'
              try:
                  if expected is not None:
                      verify(repo)
                      if copied is not None:
                          for file, sha in expected.items():
                              check(digest(safe_file(copied, file[len(crate_prefix):])) == sha)
                          check({p.relative_to(copied).as_posix() for p in copied.rglob('*') if p.is_file()} == {p[len(crate_prefix):] for p in expected})
                          check(not any(p.is_symlink() for p in copied.rglob('*')))
                      report['sourceFreezePost'] = True
              except Exception:
                  report['category'] = 'SOURCE_FREEZE_POST'
                  report['result'] = 'PARTIAL_FAILURE'
              accepted = report['result'] == 'PASS' and report['sourceFreezePost'] and report.get('receiptValidated') is True and report.get('supervisorTestResult') == 'PASS' and report['cryptoTestsExecuted']
              report['technicalPass'] = bool(accepted)
              report['recoveryPrototypeReadonlyValidated'] = bool(accepted)
              report['configuredCaseMs'] = 60000
              report['configuredBatchMs'] = 300000
              report['configuredRssThresholdBytes'] = 805306368
              report['configuredSamplingIntervalMs'] = 50
              report['actualMaximumSamplingGapMs'] = None
              report['hardPeakRssGuaranteed'] = False
              report['kdfInvocationCount'] = None
              print(json.dumps(report, sort_keys=True), flush=True)
          sys.exit(0 if report.get('technicalPass') is True else 1)
          PY_CI
