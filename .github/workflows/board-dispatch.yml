name: Board dispatch (prepara pedidos de revision)
# Solo prepara el artefacto con base/head exactos. No llama modelos, no usa secretos,
# no responde por los revisores. El script se toma del commit BASE (confiable) y el
# codigo del PR se lee solo como diff (texto). Residual conocido: un PR del mismo repo puede
# editar este YAML; corre con token de solo lectura y sin secretos, igual que los demas workflows.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: board-dispatch-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: data
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - name: Preparar pedidos para el par exacto base/head
        run: |
          if [ ! -f trusted/scripts/board-dispatch.mjs ]; then
            echo "El commit base aun no tiene el despachador; se omite (primer PR que lo introduce)."
            exit 0
          fi
          node trusted/scripts/board-dispatch.mjs prepare --repo data --base "$BASE_SHA" --head "$HEAD_SHA" --out out
          node trusted/scripts/board-dispatch.mjs status --out out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: hashFiles('out/manifest.json') != ''
        with:
          name: board-${{ env.BASE_SHA }}-${{ env.HEAD_SHA }}
          path: |
            out/manifest.json
            out/change.patch
            out/request-*.txt
          if-no-files-found: error
          retention-days: 14
