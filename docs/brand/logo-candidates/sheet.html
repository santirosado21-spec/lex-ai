<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>LEX AI active logo candidate contact sheet</title><style>*{box-sizing:border-box}body{margin:0;width:1800px;min-height:1320px;padding:76px 100px;background:#fff;color:#0F1B2D;font-family:Arial,sans-serif}h1{margin:0 0 36px;font:600 30px Georgia,serif}.candidates{display:grid;grid-template-columns:repeat(3,1fr);gap:72px}.candidate{display:grid;grid-template-columns:1fr 1fr;gap:24px 30px;align-items:end}h2{grid-column:1/-1;margin:0;font:600 30px Georgia,serif}.large{grid-column:1/-1;height:300px;display:grid;place-items:center;border-radius:28px;background:#EEF1F4}.large img{width:200px;height:200px}.label{margin:0 0 10px;color:#52606D;font-size:17px}.icon{width:128px;height:128px;display:grid;place-items:center;border-radius:30px;background:#EEF1F4}.icon.dark{background:#0E141C}.icon img{width:64px;height:64px}.dark img{filter:brightness(0) invert(1)}.sizes{grid-column:1/-1;display:flex;gap:48px;align-items:end}.size{display:grid;gap:10px;justify-items:center;color:#52606D;font-size:17px}.size-box{width:96px;height:96px;display:grid;place-items:center;border:2px solid #D9DEE5;border-radius:16px}.size-box img{display:block}</style></head><body><h1>LEX AI · active candidate contact sheet</h1><main class="candidates"><section class="candidate"><h2>A2 — square citation L</h2><div class="large"><img src="candidate-a2/mark.svg" alt="Candidate A2 at 200 pixels"></div><div><p class="label">64 px · light</p><div class="icon"><img src="candidate-a2/mark.svg" alt=""></div></div><div><p class="label">64 px · dark</p><div class="icon dark"><img src="candidate-a2/mark-mono.svg" alt=""></div></div><div class="sizes"><div class="size"><div class="size-box"><img src="candidate-a2/mark.svg" width="32" height="32" alt=""></div>32 px</div><div class="size"><div class="size-box"><img src="candidate-a2/mark.svg" width="16" height="16" alt=""></div>16 px</div></div></section><section class="candidate"><h2>C — circular seal</h2><div class="large"><img src="candidate-c/mark.svg" alt="Candidate C at 200 pixels"></div><div><p class="label">64 px · light</p><div class="icon"><img src="candidate-c/mark.svg" alt=""></div></div><div><p class="label">64 px · dark</p><div class="icon dark"><img src="candidate-c/mark-mono.svg" alt=""></div></div><div class="sizes"><div class="size"><div class="size-box"><img src="candidate-c/mark.svg" width="32" height="32" alt=""></div>32 px</div><div class="size"><div class="size-box"><img src="candidate-c/mark.svg" width="16" height="16" alt=""></div>16 px</div></div></section><section class="candidate"><h2>D — pinpoint citation</h2><div class="large"><img src="candidate-d/mark.svg" alt="Candidate D at 200 pixels"></div><div><p class="label">64 px · light</p><div class="icon"><img src="candidate-d/mark.svg" alt=""></div></div><div><p class="label">64 px · dark</p><div class="icon dark"><img src="candidate-d/mark-mono.svg" alt=""></div></div><div class="sizes"><div class="size"><div class="size-box"><img src="candidate-d/mark.svg" width="32" height="32" alt=""></div>32 px</div><div class="size"><div class="size-box"><img src="candidate-d/mark.svg" width="16" height="16" alt=""></div>16 px</div></div></section></main></body></html>
